[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.22"

[features]
resolution = true
skip-lint = false

[programs.devnet]
breathprint = "BPrnt1111111111111111111111111111111111111"

[programs.localnet]
breathprint = "BPrnt1111111111111111111111111111111111111"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://devnet.helius-rpc.com/?api-key=YOUR_HELIUS_KEY"

[test]
startup_wait = 10000
